<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Live Stats">
<meta name="theme-color" content="#1f1f1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Live Stats</title>
<style>
:root{--blue:#2E6FC4;--orange:#E8803A;--green:#2E9E5B;--red:#D9534F;--ink:#1d1d1f;--muted:#777;--court:#DCEBDD;--court2:#BFE0C9;--courtInk:#1d4a2c;--fault:#FBE3E1;--faultInk:#B03A30;--bg:#fff;--soft:#f0f0f3;--band:#1f1f1f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px}
#score{background:var(--band);color:#fff;padding:10px 14px 9px}
#score table{width:100%;border-collapse:collapse;font-size:15px}
#score td{padding:2px 0;white-space:nowrap}
#score .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:200px}
#score .s{text-align:center;width:26px;color:#bbb}
#score .g{text-align:center;width:46px;font-weight:800;font-size:17px;background:#333;border-radius:6px}
.srv{display:inline-block;width:8px;height:8px;border-radius:50%;background:#C6F24E;margin-right:5px;vertical-align:middle}
.nosrv{display:inline-block;width:8px;margin-right:5px}
#ctx{font-size:12.5px;color:#C6F24E;margin-top:5px;display:flex;justify-content:space-between}
main{flex:1;overflow-y:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.q{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.btn{border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;text-align:center;line-height:1.15;min-height:52px;padding:4px}
.btn:active,.d:active,.b:active{filter:brightness(.88)}
.zone{height:118px;background:var(--court);color:var(--courtInk);flex-direction:column;font-size:26px}
.zone small{font-size:13px;font-weight:600;color:#4b7a5a;margin-top:3px}
.flt{height:62px;background:var(--fault);color:var(--faultInk)}
.grey{background:var(--soft);color:#333;font-size:15px}
.chips{margin-bottom:4px}
.chip{display:inline-block;background:var(--soft);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600;margin:0 4px 6px 0}
.chip.r{background:var(--fault);color:var(--faultInk)} .chip.g{background:var(--court);color:var(--courtInk)} .chip.sv{background:#EDE3F7;color:#5b2e8f}
.svt{float:right;border:1px solid #c9b3e3;background:#fff;color:#5b2e8f;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600}
.svt.on{background:#7a4bb5;color:#fff;border-color:#7a4bb5}
.court{background:var(--court);border-radius:8px;padding:8px 8px 6px}
.net{height:5px;background:#333;border-radius:2px;margin-bottom:6px}
.strip{height:180px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.strip button{background:var(--court2);border-radius:6px;font-size:32px;font-weight:800;color:var(--courtInk)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.who button{height:48px;border-radius:12px;font-weight:800;font-size:15px;background:var(--soft);color:#555}
.who button.selP{background:var(--blue);color:#fff} .who button.selO{background:var(--orange);color:#fff}
.shot h5{font-size:12px;color:var(--muted);margin:7px 0 4px;text-transform:uppercase}
.d{min-height:40px;background:#EEF3FB;color:#1b3f78;border-radius:11px;font-size:13.5px;font-weight:650;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:3px}
.d.sel{background:var(--blue);color:#fff}
.dis{opacity:.35;pointer-events:none}
.res{display:grid;grid-template-columns:72px 1fr 1fr 1fr;gap:6px;margin-top:4px;align-items:center}
.res .l{font-weight:800;font-size:14px}
.res .b{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff}
.hint{font-size:12.5px;color:#666;line-height:1.45;margin-top:10px}
nav{height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;background:#fff}
nav button{text-align:center;font-size:11px;color:#888;flex:1;padding-top:4px}
nav button i{display:block;font-style:normal;font-size:21px;margin-bottom:2px}
nav button.on{color:var(--blue);font-weight:700}
.field{display:block;width:100%;border:1px solid #ddd;border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;padding:8px 2px;font-size:14px;font-weight:600;border-radius:8px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.big{height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;margin-top:10px;width:100%}
.cnt{display:grid;grid-template-columns:1fr 50px 52px 52px;gap:7px;align-items:center;margin-bottom:6px}
.cnt .t{font-size:14.5px;font-weight:600} .cnt .v{font-size:22px;font-weight:800;text-align:center}
.cnt button{height:44px;border-radius:12px;color:#fff;font-size:24px;font-weight:800}
.cnt button.m{background:var(--soft);color:#555;font-size:22px}
.grp{font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px;text-transform:uppercase}
.pt{display:grid;grid-template-columns:34px 1fr auto;gap:6px;padding:9px 2px;border-bottom:1px solid #eee;font-size:13.5px;align-items:center}
.pt .c{font-family:Menlo,monospace;font-weight:700}
.pt .w{color:#C0392B;font-weight:700;font-size:12px}
.pt .ed{color:var(--blue);font-size:13px;padding:6px}
.game{font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 2px}
.kpi{display:grid;grid-template-columns:46px 1fr 118px 1fr 46px;gap:5px;align-items:center;font-size:13px;margin:7px 0}
.kpi .bl{height:12px;background:var(--blue);border-radius:3px;justify-self:end}
.kpi .bo{height:12px;background:var(--orange);border-radius:3px}
.kpi .lab{text-align:center;font-size:12px;color:#444}
.kpi .v1{text-align:right} .kpi .best{font-weight:800}
.names{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin:4px 0 2px}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;font-size:11px;color:#fff;font-weight:700;background:#eee}
.bar div{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.legend{font-size:11.5px;color:#555;margin-top:4px;line-height:1.5}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
table.t th{font-size:11px;color:var(--muted);text-align:left;padding:4px 3px;border-bottom:1px solid #ccc}
table.t td{padding:5px 3px;border-bottom:1px solid #eee}
table.t td.n,table.t th.n{text-align:center}
.good{color:var(--green);font-weight:700} .badc{color:#C0392B;font-weight:700}
.toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));background:#1f1f1f;color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast button{color:#C6F24E;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto}
.sheet h3{font-size:18px;margin-bottom:10px}
.lbl{font-size:12px;color:var(--muted);font-weight:700;margin:6px 0 4px;text-transform:uppercase}
.err{color:#C0392B;font-size:13px;font-weight:600;margin-top:6px;min-height:18px}
.back{color:var(--blue);font-weight:600;font-size:15px;padding:6px 0}
.topline{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="score"></div>
<main id="main"></main>
<nav id="nav"></nav>
<script>
'use strict';
/* ═══ Codes (identical to the Excel 'Prise de note' grammar) ═══════════════════════════
   B = points won by the analysed player, C = points lost; E = his serve, F = opponent's serve.
   Rally code = shot letter + direction + rally length (3/5/9) + F when it is a fault.       */
const ZNAME = {1:'Extérieur',2:'Corps',3:'T',4:'T',5:'Corps',6:'Extérieur'};
const DIRS = {
  C: [['C','Croisé'],['E','Centre'],['L','Long de ligne'],['O','Décroisé (IO)'],['M','Décalage centre'],['I','Décalage ligne (II)'],['P','Passing / lob'],['A','Amorti']],
  R: [['C','Croisé'],['E','Centre'],['L','Long de ligne'],['P','Passing / lob'],['A','Amorti'],['S','Slice']],
  V: [['C','Volée CD'],['R','Volée revers'],['A','Amortie'],['S','Smash']],
};
const SHOTNAME = {C:'Coup droit',R:'Revers',V:'Volée'};
const FLT = [['N','Filet'],['L','Long'],['W','Large']];
const COUNTERS = [
  ['Décalages coup droit', [['I','Inside out'],['K','Inside in']]],
  ['Montées à la volée', [['N','CD → CD'],['P','CD → revers'],['R','Revers → CD'],['T','Revers → revers']]],
  ['Passings', [['W','CD croisé'],['Y','CD long de ligne'],['AA','Revers croisé'],['AC','Revers long de ligne']]],
];
const KEY = 'liveStatsV11';
const blank = () => ({setup:null, points:[], counters:{I:0,K:0,N:0,P:0,R:0,T:0,W:0,Y:0,AA:0,AC:0}, notes:'', draft:null, tab:'point', ended:false});
let S = load();
function load(){ try{ const x = JSON.parse(localStorage.getItem(KEY)); if (x && x.points) return x; }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pname = s => S.setup ? (s === 0 ? S.setup.p : S.setup.o) : '';
const short = s => { const n = pname(s).replace(/[^\p{L}\s'-]/gu,'').trim().split(/\s+/); return (n[n.length-1] || '').toUpperCase(); };

/* ═══ Score engine: replays every point from the setup ═══════════════════════════════════ */
function replay(points){
  const st = S.setup, fmt = st.format;
  const setsToWin = fmt === '1' ? 1 : 2;
  let sets = [], g = [0,0], pts = [0,0], tb = false, tbTarget = 7, tbFirst = null, server = st.first === 'O' ? 1 : 0, setsWon = [0,0], over = false, winner = null;
  const info = [];
  const tbServer = () => { const n = pts[0] + pts[1]; return n === 0 ? tbFirst : (Math.floor((n - 1) / 2) % 2 === 0 ? 1 - tbFirst : tbFirst); };
  const state = () => ({server: tb ? tbServer() : server, side: (pts[0] + pts[1]) % 2 === 0 ? 'D' : 'A', tb, tbTarget, sets: sets.map(x => x.slice()), g: g.slice(), pts: pts.slice(), over, winner});
  for (const p of points){
    const before = state();
    let label = '';
    if (!over){
      const w = p.col === 'B' ? 0 : 1;
      pts[w]++;
      let gameWon = false;
      if (tb){ if (pts[w] >= tbTarget && pts[w] - pts[1-w] >= 2) gameWon = true; }
      else if (pts[w] >= 4 && pts[w] - pts[1-w] >= 2) gameWon = true;
      if (gameWon){
        const superTB = tb && tbTarget === 10;
        if (superTB){ sets.push([pts[0], pts[1], 'stb']); label = pts[0] + '/' + pts[1]; }
        else { g[w]++; label = g[0] + '/' + g[1]; }
        const wasTB = tb;
        pts = [0,0];
        server = wasTB ? 1 - tbFirst : 1 - server;
        tb = false;
        let setWon = superTB || (g[w] >= 6 && g[w] - g[1-w] >= 2) || g[w] === 7;
        if (setWon){
          if (!superTB) sets.push([g[0], g[1]]);
          setsWon[w]++; g = [0,0];
          if (setsWon[w] >= setsToWin){ over = true; winner = w; }
          else if (fmt === '2s' && setsWon[0] === 1 && setsWon[1] === 1){ tb = true; tbTarget = 10; tbFirst = server; }
        } else if (g[0] === 6 && g[1] === 6){ tb = true; tbTarget = 7; tbFirst = server; }
      }
    }
    info.push({...before, label});
  }
  return {info, now: state(), sets, setsWon};
}
function pointLabel(n, tbm){ if (tbm) return n; return ['0','15','30','40'][n] ?? '40'; }
function gameScore(now){
  if (now.tb) return [now.pts[0], now.pts[1]];
  const [a, b] = now.pts;
  if (a >= 3 && b >= 3){ if (a === b) return ['40','40']; return a > b ? ['AV',''] : ['','AV']; }
  return [pointLabel(a), pointLabel(b)];
}
function finalScore(sets){ return sets.map(s => s[2] === 'stb' ? `[${s[0]}/${s[1]}]` : `${s[0]}/${s[1]}`).join(' '); }

/* ═══ Validation (same checks as the 'Contrôle' column of Prise de note) ════════════════ */
const RX = {
  first: /^[1-6][A-D]?$/, second: /^[1-6][NLW][1-6][A-D]?$/, df: /^[1-6][NLW][1-6][NLW]$/,
  shot: /^(S[1-6]?F?|T[1-6]?F?|C[CELOMIPA]?[359]?F?|R[CELPAS]?[359]?F?|V[CRAS]?[359]?F?|_)$/,
};
function checkPoint(p, server){
  const s = (p.serve || '').toUpperCase(), c = (p.code || '').toUpperCase();
  if (!c) return 'code manquant';
  if (!RX.shot.test(c)) return 'code inconnu';
  if (!s) return 'service manquant';
  if (!(RX.first.test(s) || RX.second.test(s) || RX.df.test(s))) return 'code service inconnu';
  const svFault = /^S[1-6]?F$/.test(c);
  const isDF = RX.df.test(s);
  // a double fault must be written as the server's service fault, in the server's lost column
  const serverLost = (server === 0) ? 'C' : 'B';
  if (isDF !== (svFault && p.col === serverLost)) return 'double faute ?';
  if (svFault && p.col !== serverLost) return 'serveur ?';
  if (/^S[1-6]?$/.test(c) && p.col !== (server === 0 ? 'B' : 'C')) return 'serveur ?';
  if (/^T/.test(c)){
    const returnerWon = server === 0 ? 'C' : 'B';
    if (/F$/.test(c) ? p.col === returnerWon : p.col !== returnerWon) return 'serveur ?';
  }
  return '';
}

/* ═══ Rendering ════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
function render(){
  if (!S.setup){ renderSetup(); return; }
  const R = replay(S.points);
  if (R.now.over && !S.ended){ S.ended = true; S.tab = 'end'; save(); }
  renderScore(R);
  const t = S.tab;
  $('main').innerHTML = '';
  if (t === 'point') renderPoint(R); else if (t === 'cnt') renderCounters(); else if (t === 'list') renderList(R);
  else if (t === 'stats') renderStats(R); else renderEnd(R);
  renderNav();
}
function renderNav(){
  const items = [['point','🎾','Point'],['cnt','➕','Compteurs'],['list','☰','Points'],['stats','📊','Stats'],['end','📄','Fin / Excel']];
  $('nav').style.display = '';
  $('nav').innerHTML = items.map(([k,i,l]) => `<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
}
function go(t){ S.tab = t; save(); render(); }
function renderScore(R){
  const n = R.now, gs = gameScore(n);
  const setCells = s => R.sets.map(x => `<td class="s">${x[s]}</td>`).join('');
  const cur = n.over ? '' : `<td class="s" style="color:#fff">${n.tb && n.tbTarget === 10 ? '' : n.g[0]}</td>`;
  const cur2 = n.over ? '' : `<td class="s" style="color:#fff">${n.tb && n.tbTarget === 10 ? '' : n.g[1]}</td>`;
  const dot = s => (!n.over && n.server === s) ? '<span class="srv"></span>' : '<span class="nosrv"></span>';
  const d = S.draft || {};
  const stepName = {serve1:'1ʳᵉ balle', serve1z:'1ʳᵉ balle · zone visée', serve2:'2ᵉ balle', serve2z:'Double faute · zone visée', ret:'Retour', end:'Fin du point', uncoded:'Point non codé'}[d.step || 'serve1'];
  const ctx = n.over ? `<span>Match terminé · ${esc(finalScore(R.sets))}</span><span></span>`
    : `<span>${esc(short(n.server))} sert · côté ${n.side === 'D' ? 'ÉGALITÉ' : 'AVANTAGE'}${n.tb ? (n.tbTarget === 10 ? ' · super tie-break' : ' · tie-break') : ''}</span><span>${S.tab === 'point' ? stepName : ''}</span>`;
  $('score').innerHTML = `<table>
    <tr><td class="n">${dot(0)}${esc(pname(0))}</td>${setCells(0)}${cur}<td class="g">${n.over ? '' : gs[0]}</td></tr>
    <tr><td class="n">${dot(1)}${esc(pname(1))}</td>${setCells(1)}${cur2}<td class="g">${n.over ? '' : gs[1]}</td></tr>
    </table><div id="ctx">${ctx}</div>`;
}

/* ── Setup ── */
function renderSetup(){
  $('score').innerHTML = ''; $('nav').style.display = 'none';
  const f = S.form || {p:'', pRank:'', pHand:'Droitier', o:'', oRank:'', oHand:'Droitier', tour:'', date:new Date().toLocaleDateString('fr-FR'), format:'3', first:'P'};
  S.form = f;
  const seg = (key, opts) => `<div class="seg">${opts.map(([v,l]) => `<button class="${f[key]===v?'on':''}" onclick="S.form.${key}='${v}';renderSetup()">${l}</button>`).join('')}</div>`;
  const inp = (key, ph) => `<input class="field" placeholder="${ph}" value="${esc(f[key])}" oninput="S.form.${key}=this.value">`;
  $('main').innerHTML = `<div style="font-size:24px;font-weight:800;margin:6px 0 12px">Nouveau match</div>
   <div class="q">Joueur analysé</div>${inp('p','Prénom NOM 🇫🇷')}${inp('pRank','Classement')}${seg('pHand',[['Droitier','Droitier'],['Gaucher','Gaucher']])}
   <div class="q">Adversaire</div>${inp('o','Prénom NOM 🇮🇹')}${inp('oRank','Classement')}${seg('oHand',[['Droitier','Droitier'],['Gaucher','Gaucher']])}
   <div class="q">Match</div>${inp('tour','Tournoi, tour')}${inp('date','Date')}
   ${seg('format',[['3','3 sets'],['2s','2 sets + super TB'],['1','1 set']])}
   <div class="q">Premier serveur</div>${seg('first',[['P', esc(f.p || 'Joueur')],['O', esc(f.o || 'Adversaire')]])}
   <div class="err" id="serr"></div>
   <button class="big" style="background:#1E7B45" onclick="startMatch()">Commencer le match</button>`;
}
function startMatch(){
  const f = S.form;
  if (!f.p.trim() || !f.o.trim()){ $('serr').textContent = 'Indique le nom des deux joueurs.'; return; }
  S.setup = {...f}; delete S.form; S.tab = 'point'; S.draft = null; save(); render();
}

/* ── Point entry ── */
function zoneButtons(side, fn){
  const zs = side === 'D' ? [1,2,3] : [4,5,6];
  return `<div class="g3">${zs.map(z => `<button class="btn zone" onclick="${fn}(${z})">${z}<small>${ZNAME[z]}</small></button>`).join('')}</div>`;
}
function faultButtons(fn){ return `<div class="g3">${FLT.map(([k,l]) => `<button class="btn flt" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`; }
function renderPoint(R){
  const n = R.now;
  if (n.over){ $('main').innerHTML = `<div class="hint" style="font-size:15px">Le match est terminé (${esc(finalScore(R.sets))}). Va dans <b>Fin / Excel</b> pour créer le fichier.</div>`; return; }
  const d = S.draft || (S.draft = {step:'serve1'});
  const srv = n.server, ret = 1 - srv;
  let h = '';
  const chips = [];
  if (d.z1 && d.f1) chips.push(`<span class="chip r">1ʳᵉ : ${FLT.find(x=>x[0]===d.f1)[1].toLowerCase()} · zone ${d.z1}</span>`);
  if (d.zin) chips.push(`<span class="chip g">Service : zone ${d.zin} ✓ (${d.f1 ? '2ᵉ' : '1ʳᵉ'})</span>`);
  if (d.letter) chips.push(`<span class="chip g">retour ${d.letter}</span>`);
  if (d.sv) chips.push(`<span class="chip sv">service-volée</span>`);
  if (chips.length) h += `<div class="chips">${chips.join('')}</div>`;
  const back = d.step !== 'serve1' ? `<button class="back" onclick="stepBack()">‹ Retour</button>` : '';
  if (d.step === 'serve1'){

function setStep(step){ const d = S.draft; d.hist = d.hist || []; d.hist.push(JSON.stringify({...d, hist:undefined})); d.step = step; save(); render(); }
function stepBack(){ const d = S.draft; if (d && d.hist && d.hist.length){ const prev = JSON.parse(d.hist.pop()); S.draft = {...prev, hist:d.hist}; } else S.draft = null; save(); render(); }
function upd(changes, step){ const d = S.draft; d.hist = d.hist || []; d.hist.push(JSON.stringify({...d, hist:undefined})); Object.assign(d, changes); if (step) d.step = step; save(); render(); }
function s1in(z){ upd({zin:z}, 'ret'); }
function s1fault(t){ upd({f1:t}, 'serve1z'); }
function s1faultZone(z){ upd({z1:z}, 'serve2'); }
function s2in(z){ upd({zin:z}, 'ret'); }
function s2fault(t){ upd({f2:t}, 'serve2z'); }
function s2faultZone(z){ // double fault: code service + S?F for the server, point over
  const d = S.draft, srv = replay(S.points).now.server;
  const serve = `${d.z1}${d.f1}${z}${d.f2}`;

}
function svToggle(d){ return `<button class="svt ${d.sv ? 'on' : ''}" onclick="toggleSV()">${d.sv ? '✓ ' : ''}Service-volée</button>`; }
function toggleSV(){ S.draft.sv = !S.draft.sv; save(); render(); }
function serveCode(letter){ const d = S.draft; return d.f1 ? `${d.z1}${d.f1}${d.zin}${letter || ''}` : `${d.zin}${letter || ''}`; }
function pickLetter(l){ upd({letter:l}, 'end'); }
function finishServeRet(kind){
  const d = S.draft, srv = replay(S.points).now.server, z = d.zin;
  if (kind === 'ace') commit({serve: serveCode(''), col: srv === 0 ? 'B' : 'C', code: `S${z}`});
  else if (kind === 'retF') commit({serve: serveCode(''), col: srv === 0 ? 'B' : 'C', code: `T${z}F`});

let toastTimer = null;

  const sv = !!(S.draft && S.draft.sv && p.serve);
  S.points.push(sv ? {serve: p.serve, col: p.col, code: p.code, sv: true} : {serve: p.serve, col: p.col, code: p.code});
  S.draft = null; save(); render();

  t.innerHTML = `<span><b style="font-family:Menlo,monospace">${esc(p.code)}</b> · ${p.col === 'B' ? 'gagné par ' : 'perdu par '}${esc(short(0))}${p.serve ? ' · service ' + esc(p.serve) : ''}${S.points[S.points.length - 1].sv ? ' · SV' : ''}</span><button onclick="undoLast()">Annuler</button>`;
  document.querySelectorAll('.toast').forEach(x => x.remove()); document.body.appendChild(t);

/* ── Points list + editing ── */
function describe(p){
  const c = p.code;
  if (c === '_') return 'non codé';
  if (/^S[1-6]?F$/.test(c)) return 'double faute';
  if (/^S/.test(c)) return 'ace / service gagnant';
  if (/^T.*F$/.test(c)) return 'faute de retour';
  if (/^T/.test(c)) return 'retour gagnant';
  const fault = /F$/.test(c), playerWon = p.col === 'B';
  const hitter = (playerWon !== fault) ? 0 : 1;          // a winner is hit by the point winner, a fault by the loser
  return (fault ? 'faute de ' : 'gagnant de ') + short(hitter);
}
function renderList(R){

/* ═══ Stats (same definitions as the V11 Stats tab) ═════════════════════════════════════ */
function compute(R){
  const pts = S.points.map((p, i) => ({...p, code: (p.code || '').toUpperCase(), serve: (p.serve || '').toUpperCase(), server: R.info[i].server}));
  const M = [0,1].map(s => {
    const won = s === 0 ? 'B' : 'C', lost = s === 0 ? 'C' : 'B';
    const inW = rx => pts.filter(p => p.col === won && rx.test(p.code)).length;
    const inL = rx => pts.filter(p => p.col === lost && rx.test(p.code)).length;
    const m = {};
    m.svc = inW(/^S[1-6]?$/); m.ret = inW(/^T[1-6]?$/); m.cd = inW(/^C[CELOMIPA]?[359]?$/); m.rev = inW(/^R[CELPAS]?[359]?$/); m.vol = inW(/^V[CRAS]?[359]?$/);
    m.svc_f = inL(/^S[1-6]?F$/); m.ret_f = inL(/^T[1-6]?F$/); m.cd_f = inL(/^C[CELOMIPA]?[359]?F$/); m.rev_f = inL(/^R[CELPAS]?[359]?F$/); m.vol_f = inL(/^V[CRAS]?[359]?F$/);
    m.winners = m.svc + m.ret + m.cd + m.rev + m.vol; m.faults = m.svc_f + m.ret_f + m.cd_f + m.rev_f + m.vol_f;
    m.won = pts.filter(p => p.col === won).length;
    const mine = pts.filter(p => p.server === s && p.serve);
    const srvWon = p => p.col === won;
    m.srv_pts = mine.length; m.srv_won = mine.filter(srvWon).length;
    const firsts = mine.filter(p => RX.first.test(p.serve));
    m.first_in = firsts.length; m.first_won = firsts.filter(srvWon).length;
    m.z1 = [1,2,3,4,5,6].map(z => { const f = firsts.filter(p => +p.serve[0] === z); return [f.filter(srvWon).length, f.length - f.filter(srvWon).length]; });
    const seconds = mine.filter(p => RX.second.test(p.serve));
    m.z2 = [1,2,3,4,5,6].map(z => { const f = seconds.filter(p => +p.serve[2] === z); return [f.filter(srvWon).length, f.length - f.filter(srvWon).length]; });
    m.zf = [1,2,3,4,5,6].map(z => ['N','L','W'].map(t => seconds.filter(p => +p.serve[0] === z && p.serve[1] === t).length));
    m.aces = [1,2,3,4,5,6].map(z => inW(new RegExp(`^S${z}$`))); m.dfz = [1,2,3,4,5,6].map(z => inL(new RegExp(`^S${z}F$`)));
    m.retz = [1,2,3,4,5,6].map(z => [inW(new RegExp(`^T${z}$`)), inL(new RegExp(`^T${z}F$`))]);
    m.dirs = {};
    for (const sh of ['C','R','V']) for (const [k] of DIRS[sh]) m.dirs[sh + k] = [inW(new RegExp(`^${sh}${k}[359]?$`)), inL(new RegExp(`^${sh}${k}[359]?F$`))];
    m.rally = [null, '3', '5', '9'].map(L => L ? pts.filter(p => p.col === won && new RegExp(`^(C[CELOMIPA]?|R[CELPAS]?|V[CRAS]?)${L}F?$`).test(p.code)).length : 0);
    return m;
  });
  for (const s of [0,1]){
    const m = M[s], o = M[1 - s];
    m.rally[0] = m.svc + o.ret_f + m.ret + o.svc_f;
    m.adv_faults = o.faults; m.adv_winners = o.winners;
  }
  const pct = (a, b) => b ? a / b : null;
  for (const s of [0,1]){
    const m = M[s], o = M[1 - s];
    m.won_pct = pct(m.won, m.won + o.won); m.ratio = pct(m.winners, m.faults);
    m.first_pct = pct(m.first_in, m.srv_pts); m.first_won_pct = pct(m.first_won, m.first_in);
    m.second_won_pct = pct(m.srv_won - m.first_won, m.srv_pts - m.first_in); m.srv_won_pct = pct(m.srv_won, m.srv_pts);
  }
  for (const s of [0,1]){
    const m = M[s], o = M[1 - s];
    m.ret_won_pct = pct(o.srv_pts - o.srv_won, o.srv_pts);
    m.ret1_pct = o.first_won_pct == null ? null : 1 - o.first_won_pct; m.ret2_pct = o.second_won_pct == null ? null : 1 - o.second_won_pct;
  }

}
const fmtv = (v, k) => v == null ? '–' : k === 'pct' ? Math.round(v * 100) + '%' : k === 'r' ? v.toFixed(2).replace('.', ',') : v;
function kpis(M, items){
  return `<div class="names"><span style="color:var(--blue)">${esc(short(0))}</span><span style="color:var(--orange)">${esc(short(1))}</span></div>` + items.map(([lab, key, kind, hib]) => {
    const a = M[0][key], b = M[1][key];
    const mx = kind === 'pct' ? 1 : Math.max(1, (a || 0), (b || 0)) * 1.15;
    const wa = a == null ? 0 : Math.min(100, a / mx * 100), wb = b == null ? 0 : Math.min(100, b / mx * 100);
    const better = (x, y) => x != null && y != null && (hib ? x > y : x < y);
    return `<div class="kpi"><div class="v1 ${better(a, b) ? 'best' : ''}">${fmtv(a, kind)}</div><div class="bl" style="width:${wa}%"></div><div class="lab">${lab}</div><div class="bo" style="width:${wb}%"></div><div class="${better(b, a) ? 'best' : ''}">${fmtv(b, kind)}</div></div>`;
  }).join('');
}
function shareBar(items){
  const tot = items.reduce((a, x) => a + x[1], 0) || 1;
  return `<div class="bar">${items.map(([l, v, c]) => `<div style="width:${v / tot * 100}%;background:${c}">${v / tot >= .08 ? Math.round(v / tot * 100) + '%' : ''}</div>`).join('')}</div>
    <div class="legend">${items.map(([l, v, c]) => `<span style="color:${c}">■</span> ${l} ${v}`).join(' &nbsp; ')}</div>`;
}
function renderStats(R){
  const M = compute(R), sub = S.statTab || 'all';
  const tabs = [['all',"Vue d'ensemble"],['srv','Service'],['ret','Retour'],['shots','Coups']];
  let h = `<div class="seg">${tabs.map(([k,l]) => `<button class="${sub===k?'on':''}" onclick="S.statTab='${k}';save();render()">${l}</button>`).join('')}</div>`;
  if (sub === 'all'){
    h += kpis(M, [['Points gagnés','won_pct','pct',1],['Points gagnants','winners','n',1],['Fautes','faults','n',0],['Gagnants / fautes','ratio','r',1],
      ['Aces / serv. gagnants','svc','n',1],['Doubles fautes','svc_f','n',0],['1ʳᵉ balle','first_pct','pct',1],['Gagnés derrière 1ʳᵉ','first_won_pct','pct',1],
      ['Gagnés derrière 2ᵉ','second_won_pct','pct',1],['Gagnés au retour','ret_won_pct','pct',1]]);
    for (const s of [0,1]){
      const m = M[s], pal = s === 0 ? ['#2E6FC4','#5B8FD8','#8DB4E8','#1F4E8C','#B9CFEE'] : ['#D9682A','#E8803A','#F2A66E','#A9521F','#F6C8A4'];
      h += `<div class="q" style="margin-top:14px">D'où viennent ses points · ${esc(short(s))}</div>` + shareBar([['Gagnants CD', m.cd, pal[0]],['Gagnants revers', m.rev, pal[1]],['Volée / smash', m.vol, pal[2]],['Service', m.svc, pal[3]],['Retour', m.ret, pal[4]],['Fautes adverses', m.adv_faults, '#BDBDBD']]);
      h += `<div class="q" style="margin-top:10px">Comment il perd ses points · ${esc(short(s))}</div>` + shareBar([['Fautes CD', m.cd_f, '#C0392B'],['Fautes revers', m.rev_f, '#E07070'],['Doubles fautes', m.svc_f, '#8E1B1B'],['Fautes retour', m.ret_f, '#F2A3A3'],['Fautes volée', m.vol_f, '#E9B4B4'],['Gagnants adverses', m.adv_winners, '#BDBDBD']]);
    }
  } else if (sub === 'srv'){
    h += kpis(M, [['1ʳᵉ balle','first_pct','pct',1],['Gagnés derrière 1ʳᵉ','first_won_pct','pct',1],['Gagnés derrière 2ᵉ','second_won_pct','pct',1],
      ['Gagnés au service','srv_won_pct','pct',1],['Aces / serv. gagnants','svc','n',1],['Doubles fautes','svc_f','n',0]]);
    const Z = ['Z1 Ext.','Z2 Corps','Z3 T','Z4 T','Z5 Corps','Z6 Ext.'];
    for (const s of [0,1]){
      const m = M[s];
      h += `<div class="q" style="margin-top:14px;color:${s ? 'var(--orange)' : 'var(--blue)'}">Service de ${esc(short(s))} par zone</div>
        <table class="t"><tr><th>Zone</th><th class="n">1ʳᵉ ✓/✗</th><th class="n">2ᵉ ✓/✗</th><th class="n">Aces</th><th class="n">DF</th><th class="n">Fautes 1ʳᵉ F/L/W</th></tr>
        ${Z.map((z, i) => `<tr><td>${z}</td><td class="n">${m.z1[i][0]} / ${m.z1[i][1]}</td><td class="n">${m.z2[i][0]} / ${m.z2[i][1]}</td><td class="n">${m.aces[i]}</td><td class="n">${m.dfz[i]}</td><td class="n">${m.zf[i].join(' / ')}</td></tr>`).join('')}</table>`;
    }
  } else if (sub === 'ret'){
    h += kpis(M, [['Gagnés au retour','ret_won_pct','pct',1],['… sur 1ʳᵉ adverse','ret1_pct','pct',1],['… sur 2ᵉ adverse','ret2_pct','pct',1],['Fautes de retour','ret_f','n',0]]);
    const Z = ['Z1 Ext.','Z2 Corps','Z3 T','Z4 T','Z5 Corps','Z6 Ext.'];
    h += `<table class="t" style="margin-top:12px"><tr><th>Zone</th><th class="n" style="color:var(--blue)">${esc(short(0))} pts / fautes</th><th class="n" style="color:var(--orange)">${esc(short(1))} pts / fautes</th></tr>
      ${Z.map((z, i) => `<tr><td>${z}</td><td class="n">${M[0].retz[i][0]} / ${M[0].retz[i][1]}</td><td class="n">${M[1].retz[i][0]} / ${M[1].retz[i][1]}</td></tr>`).join('')}</table>
      <div class="hint">Les mini-terrains A-B-C-D par zone sont dans l'onglet Stats du fichier Excel.</div>`;
  } else {
    for (const sh of ['C','R','V']){
      h += `<div class="q" style="margin-top:12px">${SHOTNAME[sh]}${sh === 'V' ? ' & smash' : ''}</div><table class="t"><tr><th>Direction</th><th class="n" style="color:var(--blue)">${esc(short(0))} G / F</th><th class="n">eff.</th><th class="n" style="color:var(--orange)">${esc(short(1))} G / F</th><th class="n">eff.</th></tr>`;
      for (const [k, l] of DIRS[sh]){
        const a = M[0].dirs[sh + k], b = M[1].dirs[sh + k];
        const eff = x => x[0] + x[1] ? `<span class="${x[0] / (x[0] + x[1]) >= .5 ? 'good' : 'badc'}">${Math.round(x[0] / (x[0] + x[1]) * 100)}%</span>` : '–';
        h += `<tr><td>${l}</td><td class="n">${a[0]} / ${a[1]}</td><td class="n">${eff(a)}</td><td class="n">${b[0]} / ${b[1]}</td><td class="n">${eff(b)}</td></tr>`;
      }
      h += '</table>';
    }
    const L = ['1-2','3-4','5-8','9+'];
    h += `<div class="q" style="margin-top:12px">Points gagnés selon la longueur de l'échange</div><table class="t"><tr><th>Frappes</th><th class="n" style="color:var(--blue)">${esc(short(0))}</th><th class="n" style="color:var(--orange)">${esc(short(1))}</th></tr>
      ${L.map((l, i) => `<tr><td>${l}</td><td class="n">${M[0].rally[i]}</td><td class="n">${M[1].rally[i]}</td></tr>`).join('')}</table>`;
  }
  $('main').innerHTML = h;
}

/* ── End of match / export ── */
function renderEnd(R){
  const warns = S.points.map((p, i) => checkPoint(p, R.info[i].server) ? i + 1 : 0).filter(Boolean);
  const fs = finalScore(R.sets) || '—';
  const winTxt = R.now.over ? `Victoire de <b>${esc(pname(R.now.winner))}</b>` : 'Match en cours';
  $('main').innerHTML = `<div style="text-align:center;margin-top:16px"><div style="font-size:15px;color:#777">${R.now.over ? 'Match terminé' : 'Score actuel'}</div>
    <div style="font-size:32px;font-weight:800;margin:6px 0">${esc(fs)}</div><div style="font-size:15px">${winTxt} · ${S.points.length} points</div></div>
    <div style="background:${warns.length ? 'var(--fault)' : 'var(--court)'};border-radius:14px;padding:12px 14px;margin:18px 0 6px;font-size:14px;color:${warns.length ? 'var(--faultInk)' : 'var(--courtInk)'}">
      ${warns.length ? '⚠ Points à vérifier : n° ' + warns.join(', ') + ' (onglet Points)' : '✓ Saisie contrôlée : 0 ligne à vérifier'}</div>
    <button class="big" style="background:#1E7B45" onclick="exportXlsx()">📄 Créer le fichier Excel V13</button>
    <div style="font-size:12.5px;color:#666;text-align:center;margin-top:6px">${esc(fileName())}</div>
    <div class="err" id="xerr" style="text-align:center"></div>
    <div class="lbl" style="margin-top:14px">Remarques (vont dans la case Remarques de Prise de note)</div>
    <textarea class="field" rows="5" oninput="S.notes=this.value;save()" placeholder="Remarques du match…">${esc(S.notes)}</textarea>
    <div class="hint">Le fichier est ton modèle V11 avec la Prise de note remplie (codes, service, score, compteurs, remarques) : l'onglet Stats calcule exactement les mêmes chiffres qu'une saisie à la main.</div>
    <button class="big" style="background:#fff;color:#C0392B;border:1px solid #eee;margin-top:24px" onclick="newMatch()">Nouveau match (efface celui-ci)</button>`;
}
function newMatch(){
  if (!confirm('Effacer ce match et en commencer un nouveau ? Crée le fichier Excel avant si ce n\'est pas fait.')) return;
  const keep = S.setup; S = blank(); S.form = {...keep, date: new Date().toLocaleDateString('fr-FR')}; save(); render();
}
function fileName(){
  const ln = s => short(s) || (s ? 'ADVERSAIRE' : 'JOUEUR');
  return `${ln(0)}-${ln(1)} ${S.setup.tour || ''}`.trim().replace(/[\\/:*?"<>|]/g, '-') + '.xlsx';
}

      data = new TextEncoder().encode(xml);
    }
    entries.push([name, data]);
  }
  return zip(entries);
}
async function exportXlsx(){
  const err = $('xerr'); err.textContent = 'Création du fichier…';
  try {
    const blob = await buildXlsx(), name = fileName();
    const file = new File([blob], name, {type: blob.type});
    err.textContent = '';
    if (navigator.canShare && navigator.canShare({files: [file]})){
      try { await navigator.share({files: [file], title: name}); return; } catch(e){ if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  } catch(e){ err.textContent = 'Erreur : ' + e.message; }
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
